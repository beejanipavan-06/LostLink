spring.application.name=lostlink-backend
server.port=8080

# Default In-Memory H2 Database (Runs automatically out-of-the-box without needing local MySQL server)
spring.datasource.url=jdbc:h2:mem:lostlinkdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

